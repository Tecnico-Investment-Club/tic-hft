version: '3.8'

services:
  hft-orders:
    build: .
    image: tic-hft-orders:latest
    container_name: tic-hft-orders
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - DRY_RUN=false
      - MIN_SLEEP=100
      - MAX_SLEEP=500
      - LOG_FILE=/app/orders.json
    volumes:
      - ./logs:/app
    restart: unless-stopped
    networks:
      - tic-network

networks:
  tic-network:
    driver: bridge
